name: Deploy advanced merchant dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-advanced-merchant-dashboard
  cancel-in-progress: false

env:
  SERVICE: advanced-merchant-dashboard
  REGION: asia-southeast2
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  GCP_WI_PROVIDER: ${{ vars.GCP_WI_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_ARTIFACT_REPOSITORY GCP_WI_PROVIDER GCP_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository Actions variable: $name"
              exit 1
            fi
          done
          python -m py_compile app.py
      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WI_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 --tag "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE"             --project "$GCP_PROJECT_ID"             --region "$REGION"             --image "$IMAGE"             --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT"             --port 8080             --cpu 1             --memory 1Gi             --concurrency 20             --min 1             --max 2             --timeout 3600             --session-affinity             --quiet
      - name: Show service URL
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          echo "Cloud Run service: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Embed URL: ${URL}/?embed=true&embed_options=light_theme" >> "$GITHUB_STEP_SUMMARY"
